services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      # Puerto de PostgreSQL expuesto al host (configurable desde .env)
      - "${DB_PORT}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - almoluerzo

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - almoluerzo

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inyecta la URL del API en el build; sale de BACKEND_URL (.env),
        # que puede ser una IP si el sistema se usa en red local.
        VITE_API_URL: ${BACKEND_URL:-http://localhost:3000}/api
    environment:
      # Mantenido por compatibilidad; el valor real viene del build arg
      VITE_API_URL: ${BACKEND_URL:-http://localhost:3000}/api
    ports:
      # nginx sin privilegios escucha en el 8080 dentro del contenedor
      - "${FRONTEND_PORT}:8080"
    depends_on:
      - backend
    networks:
      - almoluerzo

volumes:
  dbdata:

networks:
  almoluerzo:
