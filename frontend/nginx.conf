server {
    # nginx-unprivileged no puede usar puertos < 1024: escucha en el 8080.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión: el JS y el CSS pesan ~70% menos al viajar por la red.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Para el HEALTHCHECK del contenedor
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos de Vite con hash en el nombre (index-XXXX.js): nunca cambian,
    # así que el navegador puede guardarlos un año sin volver a pedirlos.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta cae en index.html (react-router maneja / y /admin).
    # index.html no se cachea, para que un despliegue nuevo se vea al instante.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
